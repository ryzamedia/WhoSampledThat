name = "whosampledthat"
main = "src/worker.js"
compatibility_date = "2025-01-17"
workers_dev = true

[[routes]]
pattern = "whosampledthat.com"
custom_domain = true

[[routes]]
pattern = "www.whosampledthat.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/share/*", "/api/share-image/*"]
