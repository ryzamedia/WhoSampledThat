name: Restore domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    if: github.repository == 'ryzamedia/WhoSampledThat'
    runs-on: ubuntu-latest
    steps:
      - name: Restore missing Cloudflare zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const base = 'https://api.cloudflare.com/client/v4';
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json',
          };
          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, { ...options, headers });
            const data = await response.json();
            if (!response.ok || !data.success) {
              console.log(JSON.stringify({ status: response.status, errors: data.errors }));
              throw new Error('Cloudflare domain operation failed');
            }
            return data.result;
          }
          const query = new URLSearchParams({
            name: 'whosampledthat.com',
            'account.id': process.env.CLOUDFLARE_ACCOUNT_ID,
          });
          const zones = await request(`/zones?${query}`);
          const zone = zones[0] ?? await request('/zones', {
            method: 'POST',
            body: JSON.stringify({
              name: 'whosampledthat.com',
              account: { id: process.env.CLOUDFLARE_ACCOUNT_ID },
              type: 'full',
            }),
          });
          console.log(JSON.stringify({
            domain: zone.name,
            status: zone.status,
            nameservers: zone.name_servers,
          }));
          JS
