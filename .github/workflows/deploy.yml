name: Build and Deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  # This job runs for all PRs and pushes (including from forks)
  test:
    runs-on: ubuntu-latest
    name: Test and Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # This job ONLY runs on the original repository, NOT on forks
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: test
    # Security: Only deploy from the original repository on push to main/master
    if: github.event_name == 'push' && github.repository == 'ryzamedia/WhoSampledThat'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report custom domain nameservers
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const url = new URL('https://api.cloudflare.com/client/v4/zones');
          url.searchParams.set('name', 'whosampledthat.com');
          url.searchParams.set('account.id', process.env.CLOUDFLARE_ACCOUNT_ID);
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          });
          const data = await response.json();
          if (!response.ok || !data.success) {
            throw new Error(`Unable to inspect domain configuration (HTTP ${response.status})`);
          }
          for (const zone of data.result) {
            console.log(JSON.stringify({
              domain: zone.name,
              status: zone.status,
              nameservers: zone.name_servers,
            }));
          }
          if (!data.result.length) console.log('No whosampledthat.com zone in the deployment account.');
          JS
